<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .section { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; }
        input, button { margin: 5px; padding: 8px; }
        #result { margin-top: 10px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Portal</h1>
        <a href="/">Back to Home</a> | <button onclick="exitApp()">Exit</button>

        <div class="section">
            <h2>Deposit (Admin Only)</h2>
            <input type="text" id="dep-account" placeholder="Account ID">
            <input type="number" id="dep-amount" placeholder="Amount" step="0.01">
            <button onclick="deposit()">Deposit</button>
            <div id="dep-result"></div>
        </div>

        <div class="section">
            <h2>Create Account</h2>
            <input type="text" id="create-id" placeholder="Account ID">
            <select id="create-type">
                <option value="savings">Savings</option>
                <option value="current">Current</option>
            </select>
            <input type="number" id="create-balance" placeholder="Initial Balance" step="0.01" value="0">
            <button onclick="createAccount()">Create Account</button>
            <div id="create-result"></div>
        </div>

        <div class="section">
            <h2>List All Accounts</h2>
            <button onclick="listAccounts()">Refresh List</button>
            <div id="accounts-list"></div>
        </div>

        <div class="section">
            <h2>Global Transaction History</h2>
            <button onclick="globalHistory()">Refresh History</button>
            <div id="global-history"></div>
        </div>
    </div>

    <script>
        async function getData(url) {
            const response = await fetch(url);
            return response.json();
        }

        async function postData(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return response.json();
        }

        async function deposit() {
            const account = document.getElementById('dep-account').value;
            const amount = document.getElementById('dep-amount').value;
            const result = await postData('/deposit', { account_id: account, amount: amount });
            document.getElementById('dep-result').innerText = result.success ? `New Balance: ₹${result.balance.toFixed(2)}` : result.message;
            if (result.success) listAccounts();
        }

        async function createAccount() {
            const id = document.getElementById('create-id').value;
            const type = document.getElementById('create-type').value;
            const balance = document.getElementById('create-balance').value;
            const result = await postData('/admin/create_account', { account_id: id, account_type: type, initial_balance: balance });
            document.getElementById('create-result').innerText = result.success ? `Account created: ${result.account.id}` : result.message;
            if (result.success) listAccounts();
        }

        async function listAccounts() {
            const result = await getData('/admin/list_accounts');
            let html = '<table><tr><th>ID</th><th>Type</th><th>Balance</th></tr>';
            result.accounts.forEach(acc => {
                html += `<tr><td>${acc.id}</td><td>${acc.type}</td><td>₹${acc.balance.toFixed(2)}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('accounts-list').innerHTML = html;
        }

        async function globalHistory() {
            const result = await getData('/admin/global_history');
            let html = '<table><tr><th>Time</th><th>Account ID</th><th>Type</th><th>Amount</th></tr>';
            result.history.forEach(entry => {
                html += `<tr><td>${entry.time}</td><td>${entry.id}</td><td>${entry.type}</td><td>₹${entry.amount.toFixed(2)}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('global-history').innerHTML = html;
        }

        function exitApp() {
            if (confirm("Are you sure you want to exit?")) {
                window.location.href = "/";
            }
        }

        // Load data on page load
        window.onload = function() {
            listAccounts();
            globalHistory();
        };
    </script>
</body>
</html>
